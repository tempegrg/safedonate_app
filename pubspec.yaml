name: safedonate_app
description: "Secure your donations with confidence."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.1

  # State / local storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Authentication
  local_auth: ^2.1.8

  # UI
  font_awesome_flutter: ^10.7.0
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1

  # Scanner / upload / browser
  mobile_scanner: ^5.1.1
  image_picker: ^1.2.2
  image_cropper: ^8.0.2
  file_picker: ^10.3.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/safedonate-logo.png